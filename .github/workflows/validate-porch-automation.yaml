# SPDX-License-Identifier: AGPL-3.0-or-later
name: Validate Porch automation isolation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/validate-porch-actions.mjs"
  push:
    branches:
      - main
      - canary
    paths:
      - ".github/workflows/**"
      - "scripts/validate-porch-actions.mjs"

permissions:
  contents: read

concurrency:
  group: porch-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Reject external automation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Porch source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate workflow isolation
        run: node scripts/validate-porch-actions.mjs

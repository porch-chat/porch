# Porch admin contains downstream instance controls and must match the shared backend.
name: build Porch admin

on:
  push:
    branches:
      - canary
    paths:
      - ".github/workflows/_build-image.yaml"
      - ".github/workflows/build-porch-admin.yaml"
      - "fluxer_admin/**"
      - "tools/ci/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
    inputs:
      build-version:
        description: "Optional explicit Porch CalVer build version"
        type: string
        required: false
        default: ""

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: porch-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Porch contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Porch source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate Porch branding
        run: node scripts/validate-porch-branding.mjs

      - name: Validate Porch automation isolation
        run: node scripts/validate-porch-actions.mjs

  build:
    needs: validate
    uses: ./.github/workflows/_build-image.yaml
    with:
      image: fluxer-admin
      dockerfile: fluxer_admin/Dockerfile
      build-version: ${{ inputs['build-version'] }}
      moving-tags: canary
      finalise-release: false
    secrets: inherit

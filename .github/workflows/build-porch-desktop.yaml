name: build Porch desktop

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Porch release channel
        required: true
        type: choice
        options:
          - canary
          - stable
        default: canary
  push:
    branches:
      - canary
    paths:
      - ".github/workflows/build-porch-desktop.yaml"
      - "fluxer_desktop/**"
      - "packages/voice_engine_v2/**"
      - "tools/ci/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: porch-desktop-${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'canary' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Porch distribution contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      pub_date: ${{ steps.metadata.outputs.pub_date }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - name: Checkout Porch source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set build metadata
        id: metadata
        shell: bash
        run: |
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          year="$(date -u +%Y)"
          month="$((10#$(date -u +%m)))"
          day="$(date -u +%d)"
          clock="$((10#$(date -u +%H%M%S)))"
          version="${year}.${month}${day}.${clock}"
          {
            echo "version=$version"
            echo "pub_date=$now"
            echo "source_sha=${{ github.sha }}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.93.0"

      - name: Validate product contract
        working-directory: fluxer_desktop
        run: node scripts/validate-porch-product.mjs

      - name: Validate Porch branding contract
        run: node scripts/validate-porch-branding.mjs

      - name: Test desktop build orchestration
        working-directory: fluxer_desktop
        run: node --test scripts/ci-helper-command.test.mjs

      - name: Test desktop release helpers
        run: cargo test --locked --manifest-path tools/ci/Cargo.toml desktop::tests

      - name: Ensure active desktop workflow has no Fluxer release target
        working-directory: fluxer_desktop
        run: node scripts/validate-porch-workflow.mjs

  windows:
    name: Windows x64 (${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'canary' }})
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'canary' }}
      BUILD_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'canary' }}
      RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'canary' }}
      PUBLIC_RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'canary' }}
      PLATFORM: windows
      ARCH: x64
      ELECTRON_ARCH: x64
      DESKTOP_PLATFORM: windows
      DESKTOP_ARCH: x64
      DESKTOP_VARIANT: default
      FLUXER_DESKTOP_BUILD_VARIANT: default
      FLUXER_WINDOWS_GAME_CAPTURE_MODULE_ENABLED: "false"
      FLUXER_CI_MANIFEST_PATH: ${{ github.workspace }}\_ci\tools\ci\Cargo.toml
      CARGO_TARGET_DIR: C:\porch-cargo-target
      VERSION: ${{ needs.validate.outputs.version }}
      BUILD_VERSION: ${{ needs.validate.outputs.version }}
      PUBLIC_BUILD_VERSION: ${{ needs.validate.outputs.version }}
      PUB_DATE: ${{ needs.validate.outputs.pub_date }}
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    steps:
      - name: Checkout Porch CI helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: _ci

      - name: Checkout Porch source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: source

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.93.0"

      - name: Cache Cargo registries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-x64-porch-cargo-registry-v2-${{ hashFiles('_ci/tools/ci/Cargo.lock', 'source/fluxer_desktop/native/**/Cargo.lock') }}
          restore-keys: windows-x64-porch-cargo-registry-v2-

      - name: Cache Porch CI helper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: C:\porch-ci-helper
          key: windows-x64-porch-ci-helper-v2-rust-1.93.0-${{ hashFiles('_ci/tools/ci/Cargo.lock', '_ci/tools/ci/Cargo.toml', '_ci/tools/ci/**/*.rs') }}

      - name: Cache native desktop builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: C:\porch-cargo-target
          key: windows-x64-porch-native-v2-rust-1.93.0-${{ hashFiles('source/fluxer_desktop/native/**/Cargo.lock', 'source/fluxer_desktop/native/**/Cargo.toml', 'source/fluxer_desktop/native/**/*.rs') }}
          restore-keys: |
            windows-x64-porch-native-v2-rust-1.93.0-
            windows-x64-porch-cargo-v1-

      - name: Prepare Porch CI helper
        shell: pwsh
        env:
          CARGO_TARGET_DIR: C:\porch-helper-target
        run: |
          $helperDir = "C:\porch-ci-helper"
          $helper = Join-Path $helperDir "fluxer-ci.exe"
          if (-not (Test-Path -LiteralPath $helper)) {
            cargo build --locked --release --manifest-path "$env:GITHUB_WORKSPACE\_ci\tools\ci\Cargo.toml"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to build Porch CI helper"
            }
            New-Item -ItemType Directory -Path $helperDir -Force | Out-Null
            Copy-Item -LiteralPath "$env:CARGO_TARGET_DIR\release\fluxer-ci.exe" -Destination $helper
          }
          if (-not (Test-Path -LiteralPath $helper)) {
            throw "Porch CI helper is missing at $helper"
          }
          "FLUXER_CI_BIN=$helper" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Ensure python3 command
        run: '& $env:FLUXER_CI_BIN build-desktop --step ensure_python3_windows'

      - name: Shorten paths
        env:
          SUBST_TARGET: ${{ github.workspace }}/source
        run: '& $env:FLUXER_CI_BIN build-desktop --step windows_paths'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Set up pnpm
        run: '& $env:FLUXER_CI_BIN build-desktop --step setup_pnpm_corepack'

      - name: Resolve pnpm store
        run: '& $env:FLUXER_CI_BIN build-desktop --step resolve_pnpm_store_windows'

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: windows-x64-porch-desktop-${{ hashFiles('source/**/pnpm-lock.yaml') }}
          restore-keys: windows-x64-porch-desktop-

      - name: Set up MSVC
        uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c
        with:
          arch: amd64

      - name: Install Rust Windows targets
        run: '& $env:FLUXER_CI_BIN build-desktop --step install_rust_windows_targets'

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: '& $env:FLUXER_CI_BIN build-desktop --step install_dependencies'

      - name: Test portable protocol ownership
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: node --test src/common/PortableModePath.test.mjs src/main/DeepLinkRegistrationPolicy.test.mjs

      - name: Test Velopack under packaged Electron Node
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          & ".\node_modules\electron\dist\electron.exe" scripts/velopack-node-runtime-smoke.mjs

      - name: Update package version
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: '& $env:FLUXER_CI_BIN build-desktop --step update_version'

      - name: Set release channel
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: '& $env:FLUXER_CI_BIN build-desktop --step set_build_channel'

      - name: Build Electron runtime
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        env:
          FLUXER_SKIP_BUILD_CHANNEL_SYNC: "true"
        run: pnpm build

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "8.0.x"

      - name: Install Velopack
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: '& $env:FLUXER_CI_BIN build-desktop --step install_velopack_cli'

      - name: Build unpacked application
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        env:
          TEMP: C:\t
          TMP: C:\t
          ELECTRON_BUILDER_CACHE: C:\ebcache
        run: '& $env:FLUXER_CI_BIN build-desktop --step build_app_windows'

      - name: Package Velopack installer
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: '& $env:FLUXER_CI_BIN build-desktop --step package_app_windows_velopack'

      - name: Check Windows path budget
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        env:
          MAX_WINDOWS_PATH_LEN: "260"
          PATH_HEADROOM: "10"
        run: '& $env:FLUXER_CI_BIN build-desktop --step analyse_velopack_paths'

      - name: Create portable archive
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: '& $env:FLUXER_CI_BIN build-desktop --step create_portable_zip_windows'

      - name: Stage release files
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: '& $env:FLUXER_CI_BIN build-desktop --step prepare_artifacts_windows'

      - name: Generate checksums
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: '& $env:FLUXER_CI_BIN build-desktop --step generate_checksums_windows'

      - name: Upload unsigned Porch artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: porch-desktop-${{ env.BUILD_CHANNEL }}-windows-x64-${{ env.VERSION }}
          path: ${{ env.WORKDIR }}/fluxer_desktop/upload_staging
          if-no-files-found: error
          retention-days: 14

  unix:
    name: ${{ matrix.label }} (${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'canary' }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            platform: linux
            arch: x64
            electron_arch: x64
            rust_target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - label: Linux arm64
            platform: linux
            arch: arm64
            electron_arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - label: macOS Apple Silicon
            platform: macos
            arch: arm64
            electron_arch: arm64
            rust_target: aarch64-apple-darwin
            os: macos-15
          - label: macOS Intel
            platform: macos
            arch: x64
            electron_arch: x64
            rust_target: x86_64-apple-darwin
            os: macos-15-intel
    env:
      CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'canary' }}
      BUILD_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'canary' }}
      RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'canary' }}
      PUBLIC_RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'canary' }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      ELECTRON_ARCH: ${{ matrix.electron_arch }}
      DESKTOP_PLATFORM: ${{ matrix.platform }}
      DESKTOP_ARCH: ${{ matrix.arch }}
      DESKTOP_VARIANT: default
      FLUXER_DESKTOP_BUILD_VARIANT: default
      FLUXER_WINDOWS_GAME_CAPTURE_MODULE_ENABLED: "false"
      PORCH_UNSIGNED_DESKTOP_BUILD: "true"
      FLUXER_CI_MANIFEST_PATH: ${{ github.workspace }}/_ci/tools/ci/Cargo.toml
      CARGO_TARGET_DIR: ${{ github.workspace }}/.porch-cargo-target
      VERSION: ${{ needs.validate.outputs.version }}
      BUILD_VERSION: ${{ needs.validate.outputs.version }}
      PUBLIC_BUILD_VERSION: ${{ needs.validate.outputs.version }}
      PUB_DATE: ${{ needs.validate.outputs.pub_date }}
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    steps:
      - name: Checkout Porch CI helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: _ci

      - name: Checkout Porch source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: source

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.93.0"
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo registries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.platform }}-${{ matrix.arch }}-porch-cargo-registry-v1-${{ hashFiles('_ci/tools/ci/Cargo.lock', 'source/fluxer_desktop/native/**/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-${{ matrix.arch }}-porch-cargo-registry-v1-

      - name: Cache Porch CI helper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/porch-ci-helper
          key: ${{ matrix.platform }}-${{ matrix.arch }}-porch-ci-helper-v1-rust-1.93.0-${{ hashFiles('_ci/tools/ci/Cargo.lock', '_ci/tools/ci/Cargo.toml', '_ci/tools/ci/**/*.rs') }}

      - name: Cache native desktop builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.porch-cargo-target
          key: ${{ matrix.platform }}-${{ matrix.arch }}-porch-native-v1-rust-1.93.0-${{ hashFiles('source/fluxer_desktop/native/**/Cargo.lock', 'source/fluxer_desktop/native/**/Cargo.toml', 'source/fluxer_desktop/native/**/*.rs') }}
          restore-keys: ${{ matrix.platform }}-${{ matrix.arch }}-porch-native-v1-rust-1.93.0-

      - name: Prepare Porch CI helper
        shell: bash
        run: |
          helper_dir="$HOME/.cache/porch-ci-helper"
          helper="$helper_dir/fluxer-ci"
          if [[ ! -x "$helper" ]]; then
            CARGO_TARGET_DIR="$RUNNER_TEMP/porch-helper-target" \
              cargo build --locked --release --manifest-path "$GITHUB_WORKSPACE/_ci/tools/ci/Cargo.toml"
            mkdir -p "$helper_dir"
            cp "$RUNNER_TEMP/porch-helper-target/release/fluxer-ci" "$helper"
            chmod +x "$helper"
          fi
          test -x "$helper"
          echo "FLUXER_CI_BIN=$helper" >> "$GITHUB_ENV"

      - name: Set workdir
        env:
          SUBST_TARGET: ${{ github.workspace }}/source
        run: '"$FLUXER_CI_BIN" build-desktop --step set_workdir_unix'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Set up pnpm
        run: '"$FLUXER_CI_BIN" build-desktop --step setup_pnpm_corepack'

      - name: Resolve pnpm store
        run: '"$FLUXER_CI_BIN" build-desktop --step resolve_pnpm_store_unix'

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ matrix.platform }}-${{ matrix.arch }}-porch-desktop-${{ hashFiles('source/**/pnpm-lock.yaml') }}
          restore-keys: ${{ matrix.platform }}-${{ matrix.arch }}-porch-desktop-

      - name: Install Python setuptools
        if: matrix.platform == 'macos'
        run: '"$FLUXER_CI_BIN" build-desktop --step install_setuptools_macos'

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: '"$FLUXER_CI_BIN" build-desktop --step install_linux_deps'

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: '"$FLUXER_CI_BIN" build-desktop --step install_dependencies'

      - name: Test portable protocol ownership
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: node --test src/common/PortableModePath.test.mjs src/main/DeepLinkRegistrationPolicy.test.mjs

      - name: Update package version
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: '"$FLUXER_CI_BIN" build-desktop --step update_version'

      - name: Set release channel
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: '"$FLUXER_CI_BIN" build-desktop --step set_build_channel'

      - name: Build Electron runtime
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        env:
          FLUXER_SKIP_BUILD_CHANNEL_SYNC: "true"
        run: pnpm build

      - name: Build unsigned macOS application
        if: matrix.platform == 'macos'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: '"$FLUXER_CI_BIN" build-desktop --step build_app_macos'

      - name: Verify unsigned macOS artifact
        if: matrix.platform == 'macos'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: '"$FLUXER_CI_BIN" build-desktop --step verify_bundle_id'

      - name: Build Linux application
        if: matrix.platform == 'linux'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        env:
          USE_SYSTEM_FPM: "true"
        run: '"$FLUXER_CI_BIN" build-desktop --step build_app_linux'

      - name: Stage release files
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: '"$FLUXER_CI_BIN" build-desktop --step prepare_artifacts_unix'

      - name: Normalize updater metadata
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: '"$FLUXER_CI_BIN" build-desktop --step normalise_updater_yaml'

      - name: Generate checksums
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: '"$FLUXER_CI_BIN" build-desktop --step generate_checksums_unix'

      - name: Upload unsigned Porch artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: porch-desktop-${{ env.BUILD_CHANNEL }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ env.VERSION }}
          path: ${{ env.WORKDIR }}/fluxer_desktop/upload_staging
          if-no-files-found: error
          retention-days: 14

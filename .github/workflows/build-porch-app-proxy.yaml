# SPDX-License-Identifier: AGPL-3.0-or-later
# Porch client builds and static assets are validated by the same branding contract.
name: build Porch app proxy

on:
  push:
    branches:
      - canary
    paths:
      - ".github/workflows/_build-image.yaml"
      - ".github/workflows/build-porch-app-proxy.yaml"
      - "fluxer_app/**"
      - "fluxer_app_proxy/**"
      - "fluxer_common/**"
      - "fluxer_svc/**"
      - "packages/**"
      - "patches/**"
      - "scripts/validate-porch-branding.mjs"
      - "tools/ci/**"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
    inputs:
      build-version:
        description: "Optional explicit Porch CalVer build version"
        type: string
        required: false
        default: ""

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  validate-branding:
    name: Validate Porch branding contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Porch source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate Porch branding
        run: node scripts/validate-porch-branding.mjs

  build:
    needs: validate-branding
    uses: ./.github/workflows/_build-image.yaml
    with:
      image: fluxer-app-proxy-self-hosted
      dockerfile: fluxer_app_proxy/Dockerfile
      build-version: ${{ inputs['build-version'] }}
      moving-tags: canary
      finalise-release: false
      extra-build-args: |
        FLUXER_APP_PROXY_TIME_FREEZE_ENABLED=false
    secrets: inherit

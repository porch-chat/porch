# SPDX-License-Identifier: AGPL-3.0-or-later
name: build Porch static assets

on:
  push:
    branches:
      - canary
    paths:
      - ".github/workflows/_build-image.yaml"
      - ".github/workflows/build-porch-static.yaml"
      - "fluxer_static/**"
  workflow_dispatch:
    inputs:
      build-version:
        description: "Optional explicit Porch CalVer build version"
        type: string
        required: false
        default: ""

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  validate-branding:
    name: Validate Porch branding contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Porch source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate Porch branding
        run: node scripts/validate-porch-branding.mjs

  build:
    needs: validate-branding
    uses: ./.github/workflows/_build-image.yaml
    with:
      image: fluxer-static
      dockerfile: fluxer_static/Dockerfile
      build-version: ${{ inputs['build-version'] }}
      moving-tags: canary
      finalise-release: false
